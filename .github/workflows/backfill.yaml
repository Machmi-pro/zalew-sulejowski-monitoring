name: Backfill danych zbiornika Sulejów (ręczny)

# Tylko ręczne uruchomienie - to repo służy wyłącznie do jednorazowego/okazjonalnego
# pobierania historii, nie do automatycznego, codziennego crona.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Data startowa (YYYY-MM-DD)"
        required: true
        default: "2026-01-01"
      end:
        description: "Data końcowa (YYYY-MM-DD)"
        required: true
        default: "2026-12-31"
      step_days:
        description: "Odstęp w dniach między próbkami"
        required: true
        default: "7"
      output_file:
        description: "Ścieżka pliku wynikowego (w repo)"
        required: true
        default: "data/sulejow-2026.json"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zainstaluj zależności
        run: pip install -r requirements.txt

      - name: Uruchom backfill
        run: |
          python scripts/backfill_sulejow.py \
            --start "${{ github.event.inputs.start }}" \
            --end "${{ github.event.inputs.end }}" \
            --step-days "${{ github.event.inputs.step_days }}" \
            --output "${{ github.event.inputs.output_file }}"

      - name: Zapisz zmiany w repozytorium
        run: |
          git config user.name "sulejow-backfill-bot"
          git config user.email "sulejow-backfill-bot@users.noreply.github.com"
          git add "${{ github.event.inputs.output_file }}"
          git diff --quiet --cached || git commit -m "Backfill danych Sulejów: ${{ github.event.inputs.start }} - ${{ github.event.inputs.end }}"
          git pull --rebase origin main
          git push
