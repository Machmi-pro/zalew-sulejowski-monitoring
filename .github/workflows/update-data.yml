name: Aktualizacja danych zbiornika Sulejów

on:
  schedule:
    # UWAGA: godziny są w UTC!
    # 07:00 / 08:00 / 09:00 UTC = 09:00 / 10:00 / 11:00 czasu polskiego latem (CEST)
    #                           = 08:00 / 09:00 / 10:00 czasu polskiego zimą (CET)
    - cron: '00 06 * * *'
    - cron: '00 07 * * *'
    - cron: '00 08 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  aktualizuj:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v5

      - name: Ustaw Pythona
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Zainstaluj zależności
        run: pip install requests pdfplumber numpy

      - name: Uruchom skrypt pobierający dane
        run: python scripts/pobierz.py

      - name: Wylicz rzędną
        run: python scripts/oblicz_rzedna.py

      - name: Zapisz zmiany w repozytorium
        run: |
          git config user.name "sulejow-bot"
          git config user.email "sulejow-bot@users.noreply.github.com"
          git add data/sulejow.json data/rzedna_wyliczenie.json
          git diff --quiet --cached || git commit -m "Automatyczna aktualizacja danych zbiornika Sulejów"
          git pull --rebase origin main
          git push
